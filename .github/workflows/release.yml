# Builds what a user can download and publishes it as a GitHub release.
#
# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 ExorTek
#
# Signing is optional and driven by repository secrets. Without them the
# release is still produced, but it is marked clearly as unsigned: macOS
# will not load an ad-hoc signed system extension at all.
#
# To publish signed, notarized artifacts, set these repository secrets:
#   MACOS_CERT_P12         base64 of a .p12 holding the Developer ID
#                          Application identity
#   MACOS_CERT_PASSWORD    the .p12 password
#   MACOS_SIGN_APP         "Developer ID Application: NAME (TEAMID)"
#   MACOS_NOTARY_APPLE_ID  the Apple ID to notarize as
#   MACOS_NOTARY_TEAM_ID   that account's Team ID
#   MACOS_NOTARY_PASSWORD  an app-specific password for it
#
# The extension additionally needs the three DriverKit entitlements,
# granted by Apple against the App ID. See README.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and publish, without the v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      # No explicit ref: a tag push checks out the tag, and a manual run
      # checks out whatever branch it was started from. The tag for a
      # manual run does not exist yet -- it is created by the release
      # step below, at this commit.
      - uses: actions/checkout@v4

      # The tests gate the release: they are fast, they need no signing,
      # and shipping a build whose framing is broken helps nobody.
      - name: Run the tests
        run: make -C tests

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Everything downstream keys off steps.signing.outputs.available, so
      # an unsigned build is a normal path rather than a failure.
      - name: Import signing certificates
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret: building unsigned."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo -n "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "available=true" >> "$GITHUB_OUTPUT"

      # One build per architecture rather than one universal build. The
      # Makefile's defaults are overridden on the command line, and each
      # goes to its own BUILD directory so the two never share objects.
      - name: Build both architectures
        working-directory: driver
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
          SIGN_APP: ${{ secrets.MACOS_SIGN_APP }}
        run: |
          set -euo pipefail
          build_one() {
            args=(BUILD="$1" DEXT_ARCHS="$2" APP_ARCHS="$3")
            if [ "$SIGNED" = "true" ]; then
              args+=(SIGN_ID="$SIGN_APP")
            fi
            make all "${args[@]}"
          }
          # arm64e for the extension, arm64 for the app: arm64e is a
          # DriverKit requirement, not an application one.
          build_one build-applesilicon arm64e arm64
          build_one build-intel        x86_64 x86_64

          for d in build-applesilicon build-intel; do
            echo "== $d"
            lipo -info "$d/com.exortek.androidtether.driver.dext/com.exortek.androidtether.driver"
            lipo -info "$d/AndroidTether.app/Contents/MacOS/AndroidTether"
          done

      # A .app is a directory, so it has to travel inside something. A
      # disk image is what macOS users expect: open it and drag the app
      # across, with the Applications symlink right there to drop it on.
      - name: Build the disk images
        run: |
          set -euo pipefail
          mkdir -p dist
          make_dmg() {
            app="$1"; label="$2"
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "AndroidTether" -srcfolder "$stage" \
                -ov -format UDZO \
                "dist/AndroidTether-${{ steps.version.outputs.version }}-$label.dmg"
          }
          make_dmg driver/build-applesilicon/AndroidTether.app AppleSilicon-arm64e
          make_dmg driver/build-intel/AndroidTether.app        Intel-x86_64

      # Notarizing the disk image covers the app inside it, and stapling
      # the image means it opens without a round trip to Apple.
      - name: Notarize
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" \
                --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
                --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}" \
                --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
                --wait
            xcrun stapler staple "$dmg"
          done

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg | tee SHA256SUMS.txt

      - name: Compose the release notes
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            if [ "$SIGNED" != "true" ]; then
              echo "> [!CAUTION]"
              echo "> **These builds cannot be installed.** They are published"
              echo "> for review and reproducibility only. See below."
              echo
            fi
            echo "## Download"
            echo
            echo "macOS 13 Ventura or later."
            echo
            echo "| Your Mac | Download |"
            echo "|---|---|"
            echo "| Apple Silicon (M1 and later) | \`AndroidTether-$VERSION-AppleSilicon-arm64e.dmg\` |"
            echo "| Intel | \`AndroidTether-$VERSION-Intel-x86_64.dmg\` |"
            echo
            echo "Not sure which you have? Apple menu > About This Mac."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Open the disk image and drag **AndroidTether.app** onto the"
              echo "Applications folder beside it, then open it from there."
              echo "Installing from anywhere else is refused by macOS. Keep the"
              echo "app: deleting it removes the driver."
            else
              # No install instructions for a build that cannot be installed.
              echo "Each image holds **AndroidTether.app** with the system"
              echo "extension inside it, exactly as CI built it. You can inspect"
              echo "it (\`codesign -dv --entitlements -\`), but macOS will not"
              echo "open it -- see the warning below."
            fi
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> [!WARNING]"
              echo "> **These builds are unsigned, and the driver has never been"
              echo "> run against a phone.** CI had no Apple signing identity, so"
              echo "> Gatekeeper refuses to open the app at all; and the three"
              echo "> DriverKit entitlements the extension needs have not been"
              echo "> granted by Apple, so the driver would not load even past"
              echo "> that. They are published so the build is reproducible and"
              echo "> reviewable, not because they work."
              echo "> See the README for what Apple has to approve first."
              echo
            fi
            echo "Verify your download against \`SHA256SUMS.txt\`:"
            echo
            echo '```bash'
            echo "shasum -a 256 -c SHA256SUMS.txt"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AndroidTether ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          # On a manual run the tag does not exist yet; this creates it at
          # the commit that was just built and tested.
          target_commitish: ${{ github.sha }}
          # An unsigned build cannot be installed on a normally configured
          # Mac, so it is not a release in any sense a user would expect.
          # Marking it a pre-release keeps it off the repository's headline
          # and out of "latest".
          prerelease: ${{ steps.signing.outputs.available != 'true' }}
